<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание уроков</title>
<link rel="stylesheet" href="/css/style.css?v=home-sections-1">
</head>
<body>

<main>
  <section class="card hidden" aria-hidden="true">
    <div class="load-status" id="loadStatus">
      <div class="spinner"></div>
      <span class="msg">Загрузка расписания с сервера…</span>
    </div>
    <button class="reload-btn hidden" id="reloadBtn">🔄 Обновить</button>
    <div class="lesson-live hidden" id="currentLesson" aria-live="polite"></div>
  </section>

  <section id="view-home" class="view">
    <nav class="home-choices" aria-label="Разделы">
      <button class="home-choice home-current" type="button" data-open-view="view-home" aria-current="page"><span class="home-choice-icon" aria-hidden="true">🏠</span><strong>Главная</strong></button>
      <button class="home-choice" type="button" data-open-view="view-classes"><span class="home-choice-icon" aria-hidden="true">📚</span><strong>Классы</strong><span aria-hidden="true">→</span></button>
      <button class="home-choice" type="button" data-open-view="view-teachers"><span class="home-choice-icon" aria-hidden="true">👩‍🏫</span><strong>Учителя</strong><span aria-hidden="true">→</span></button>
      <button class="home-choice" type="button" data-open-view="view-rooms"><span class="home-choice-icon" aria-hidden="true">🚪</span><strong>Кабинеты</strong><span aria-hidden="true">→</span></button>
      <button class="home-choice" type="button" data-open-view="view-fav"><span class="home-choice-icon" aria-hidden="true">⭐</span><strong>Избранное</strong><span aria-hidden="true">→</span></button>
    </nav>
  </section>

  <button class="change-selection home-back hidden" id="homeBack" type="button">← На главную</button>

  <section id="view-classes" class="view hidden">
    <div class="card"><h2>Расписание по классам</h2><div id="classArea"><p class="muted">Загрузка расписания…</p></div></div>
  </section>

  <section id="view-teachers" class="view hidden">
    <div class="card"><h2>Расписание по учителям</h2><div id="teacherArea"><p class="muted">Загрузка расписания…</p></div></div>
  </section>

  <section id="view-rooms" class="view hidden">
    <div class="card"><h2>Свободные кабинеты</h2><div id="roomsArea"><p class="muted">Загрузка расписания…</p></div></div>
  </section>

  <section id="view-fav" class="view hidden">
    <div class="card"><h2>⭐ Избранное</h2><div id="favArea"><p class="muted">Загрузка расписания…</p></div></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="/js/app.js?v=home-sections-1"></script>
</body>
</html>
